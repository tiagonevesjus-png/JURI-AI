services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juriai}
      POSTGRES_USER: ${POSTGRES_USER:-juriai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.local}
    volumes:
      - juriai_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juriai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements-local.txt
    env_file: .env.local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      PRIMARY_DOMAIN: ""
      Q_SYNC: "True"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - juriai_local_media:/app/media
      - juriai_local_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  djen-monitor:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements-local.txt
    env_file: .env.local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "docker/djen_scheduler.py"]

  backup:
    image: postgres:16-alpine
    env_file: .env.local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./docker/backup_scheduler.sh:/usr/local/bin/backup_scheduler.sh:ro
    command: ["/bin/sh", "/usr/local/bin/backup_scheduler.sh"]

volumes:
  juriai_local_postgres:
  juriai_local_media:
  juriai_local_static:
