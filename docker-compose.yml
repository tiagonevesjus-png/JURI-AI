# Orquestração de produção: caddy (HTTPS), web (gunicorn), worker (fila) e Postgres.
# Uso:
#   1) cp .env.example .env  e preencha (DOMAIN, SECRET_KEY, ADMIN_PASSWORD, chaves...)
#   2) aponte o DNS do domínio (A/AAAA) para o IP deste servidor
#   3) docker compose up -d --build
#   4) acesse https://SEU_DOMINIO  (HTTPS é emitido automaticamente pelo Caddy)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juriai}
      POSTGRES_USER: ${POSTGRES_USER:-juriai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juriai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juriai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      # Tokens OAuth, índices e dados operacionais que não podem se perder em
      # uma atualização do contêiner.
      - app_data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  worker:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - app_data:/app/data
    # Não precisa migrar/coletar estáticos de novo: só processa a fila.
    entrypoint: []
    command: ["python", "manage.py", "qcluster"]

  # Monitores persistentes. Em produção eles precisam acompanhar o ciclo de
  # vida da aplicação; não devem ficar restritos ao computador local.
  djen-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "docker/djen_scheduler.py"]

  google-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    command: ["python", "docker/google_scheduler.py"]

  drive-clientes-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    command: ["python", "docker/drive_scheduler.py"]

  datajud-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "docker/datajud_scheduler.py"]

  triagem-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "docker/triagem_scheduler.py"]

  prazos-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "docker/prazos_scheduler.py"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/backups
      - ./docker/backup_scheduler.sh:/usr/local/bin/backup_scheduler.sh:ro
    command: ["/bin/sh", "/usr/local/bin/backup_scheduler.sh"]

  backup-report-monitor:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      SKIP_STARTUP_TASKS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups:ro
    command: ["python", "docker/backup_report_scheduler.py"]

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
  app_data:
  backup_data:
